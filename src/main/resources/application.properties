# Application Configuration for Crumb Bakery Web Platform
spring.application.name=Crumb Bakery Platform
server.port=8080

# MySQL Database Configuration
# Default is 3306 as specified in the assignment brief; DB_PORT environment variable allows override if local OS reserves 3306
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/crumb_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=crumb123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Session Configuration (Simple HTTP Session)
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=CRUMB_SESSION_ID

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
